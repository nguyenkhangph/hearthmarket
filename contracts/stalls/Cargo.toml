[package]
name = "stalls"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Hearthmarket player stalls: listings with goods and gold in escrow, against the game contract's NEP-141 gold and NEP-245 goods"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
