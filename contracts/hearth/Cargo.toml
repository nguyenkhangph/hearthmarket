[package]
name = "hearth"
version = "0.1.0"
edition = "2021"
description = "Hearthmarket game contract: village market, NPC spending guard, orders, guilds, stalls, world oracle"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
